name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag against the package version
        run: |
          version=$(node -p "require('./plugin/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Run both suites
        run: npm test

      - name: Build the bundle
        run: npm run pack

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          version=$(node -p "require('./plugin/package.json').version")
          mkdir -p release
          cp dist/*.tgz "release/dsh-knowledge-base-$version.tgz"
          tar -tzf "release/dsh-knowledge-base-$version.tgz" | grep -qx 'package/LICENSE'
          cmp skill/scripts/kb.py engine/kb.py
          (cd skill && zip -r ../release/skill.zip SKILL.md SKILL.ru.md scripts)
          (cd release && sha256sum 'dsh-knowledge-base-'*.tgz skill.zip > SHA256SUMS)
          awk -v v="## $version " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' \
            CHANGELOG.md > release/NOTES.md
          test -s release/NOTES.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/NOTES.md
          files: |
            release/dsh-knowledge-base-*.tgz
            release/skill.zip
            release/SHA256SUMS
