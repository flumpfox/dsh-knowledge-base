name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag against the package version
        run: |
          version=$(node -p "require('./plugin/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Run both suites
        run: npm test

      - name: Build the bundle
        run: npm run pack

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euxo pipefail
          version=$(node -p "require('./plugin/package.json').version")
          mkdir -p release
          tgz=$(find dist -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tgz"
          cp "$tgz" "release/dsh-knowledge-base-$version.tgz"
          # Not `tar | grep -q`: grep closes the pipe on the first match, tar dies of SIGPIPE
          # and `pipefail` turns that into a failed step.
          tar -tzf "release/dsh-knowledge-base-$version.tgz" > release/listing.txt
          grep -qx '^package/LICENSE$' release/listing.txt
          rm release/listing.txt
          diff -q skill/scripts/kb.py engine/kb.py
          # Python's zipfile is always present (setup-python above); `zip` is not
          # guaranteed on every runner image.
          (cd skill && python -m zipfile -c ../release/skill.zip SKILL.md SKILL.ru.md scripts)
          (cd release && sha256sum "dsh-knowledge-base-$version.tgz" skill.zip > SHA256SUMS)
          awk -v v="## $version " 'index($0, v) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > release/NOTES.md
          test -s release/NOTES.md
          ls -la release

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/NOTES.md
          files: |
            release/dsh-knowledge-base-*.tgz
            release/skill.zip
            release/SHA256SUMS
